# docker-compose for Airalo Scraper.
#
# Usage:
#   docker compose build
#   docker compose run --rm scraper airalo targets
#   docker compose run --rm scraper airalo run example
#   docker compose up api          # FastAPI service on :8000
#   docker compose up -d postgres  # bring up the SQL backend
#
# Persistent storage is volume-mounted at ./data, so JSONL output and SQLite
# files survive across container restarts.

services:
  scraper:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: airalo:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    # Default: print CLI help. Override on the command line.
    command: ["airalo", "--help"]

  api:
    image: airalo:latest
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    command: ["airalo", "serve", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - postgres

  # Optional: enable for the SQL storage backend.
  # Set STORAGE__BACKEND=sql and
  # STORAGE__DATABASE_URL=postgresql+asyncpg://scraper:scraper@postgres:5432/scraper
  # in your .env to make the scraper write here.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
