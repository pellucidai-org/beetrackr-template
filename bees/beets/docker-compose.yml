# docker-compose for Beets.
#
# Usage:
#   docker compose build
#   docker compose run --rm scraper beets targets
#   docker compose run --rm scraper beets scrape -p airalo --limit 3
#   docker compose up api

services:
  scraper:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: beets:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    command: ["beets", "--help"]

  api:
    image: beets:latest
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    command: ["beets", "serve", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
