{% extends "base.html" %}
{% block title %}Create account · {{ app_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
    <h1 class="text-2xl font-semibold tracking-tight mb-1">Create account</h1>
    <p class="text-sm text-slate-500 mb-6">{{ app_name }} dashboard</p>

    {% if error %}
      <div class="mb-4 px-3 py-2 rounded-md bg-rose-50 text-rose-700 text-sm">
        Could not create account: {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/ui/register" class="space-y-4">
      <div>
        <label class="text-sm font-medium text-slate-700">Email</label>
        <input name="email" type="email" required autofocus
               class="mt-1 w-full px-3 py-2 rounded-md border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Password</label>
        <input name="password" type="password" required minlength="8"
               class="mt-1 w-full px-3 py-2 rounded-md border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none" />
        <p class="mt-1 text-xs text-slate-400">At least 8 characters.</p>
      </div>
      <button type="submit"
              class="w-full px-3 py-2 rounded-md bg-slate-900 text-white font-medium hover:bg-slate-800">
        Create account
      </button>
    </form>

    <p class="mt-6 text-sm text-slate-500 text-center">
      Already have an account?
      <a href="/ui/login" class="text-slate-900 font-medium hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
